name: SecondChance CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix secondChance-backend
      - run: npm ci --prefix sentiment
      - run: npm ci --prefix secondChance-frontend
      - run: npm test
      - run: npm run build
        env:
          CI: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: secondchance-frontend
          path: secondChance-frontend/build
